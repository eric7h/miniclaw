name: Container

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build local candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./container
          file: ./container/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: miniclaw-agent:test-${{ matrix.arch }}
          cache-from: type=gha,scope=miniclaw-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=miniclaw-agent-${{ matrix.arch }}

      - name: Start candidate and probe Chromium over HTTP
        run: ./scripts/smoke-agent-image.sh "miniclaw-agent:test-${{ matrix.arch }}" "${{ matrix.arch }}"
